[workspace]
resolver = "2"
members = ["crates/safety", "crates/core", "crates/gui-core", "crates/cli"]
# The Tauri shell builds a webview app (heavy, needs the frontend dist + npm); it
# is built by its own CI job, not the core `cargo test --workspace`.
exclude = ["crates/gui/src-tauri"]

[workspace.package]
# The single source for the four workspace crates. The Tauri shell is outside
# the workspace and cannot inherit it, so `scripts/verify.sh` has a gate that
# asserts all five agree — see D5 in ROADMAP.md.
version = "0.4.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "5"
plist = "1"
# Only for `geteuid`, in `core::privilege` — see that module for why the single
# `unsafe` in this workspace lives there. It was previously a dev-only
# dependency (via tempfile and filetime); this is the first time it reaches the
# shipped binary.
libc = "0.2"
clap = { version = "4", features = ["derive"] }
dirs = "5"
tempfile = "3"
filetime = "0.2"
proptest = "1"

[profile.release]
strip = true
lto = "thin"
