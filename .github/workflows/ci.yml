name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    # macOS: this is a macOS-targeted tool and the `trash` crate links system frameworks.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Safety guard — tests must not touch the real home
        run: |
          # Integration tests must build their own tempfile fixture, never
          # resolve the real $HOME (SAFETY CONTRACT item 7).
          if rg -n 'dirs::home_dir|env::var\("HOME"\)|env::home_dir' \
                -g '**/tests/**/*.rs' crates; then
            echo "::error::A test resolves the real home directory. Use a tempfile fixture instead (SAFETY CONTRACT item 7)."
            exit 1
          fi
          echo "OK: no test resolves the real home directory."
