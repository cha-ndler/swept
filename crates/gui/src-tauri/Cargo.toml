[package]
name = "macclean-gui"
version = "0.2.0"
edition = "2021"
description = "mac-cleaner desktop GUI (Tauri shell over macclean-core)."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
macclean-core = { path = "../../core" }
macclean-gui-core = { path = "../../gui-core" }

[[bin]]
name = "macclean-gui"
path = "src/main.rs"
