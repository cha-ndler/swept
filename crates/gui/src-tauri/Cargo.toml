[package]
name = "macclean-gui"
version = "0.2.0"
edition = "2021"
description = "mac-cleaner desktop GUI (Tauri shell over macclean-core)."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: decodes the menu-bar template icon at startup via
# tauri::image::Image::from_bytes, which is gated behind it.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
macclean-core = { path = "../../core" }
macclean-gui-core = { path = "../../gui-core" }

[[bin]]
name = "macclean-gui"
path = "src/main.rs"
