[package]
name = "swept-gui"
version = "0.4.0"
edition = "2021"
description = "Swept desktop GUI (Tauri shell over swept-core)."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: decodes the menu-bar template icon at startup via
# tauri::image::Image::from_bytes, which is gated behind it.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swept-core = { path = "../../core" }
swept-gui-core = { path = "../../gui-core" }

[[bin]]
name = "swept-gui"
path = "src/main.rs"
