# This crate is its own workspace root. The repo root's `workspace.exclude`
# already achieves that in the main checkout, but a git worktree lives at
# `.claude/worktrees/<name>/` *inside* the main repo, so cargo's upward search
# finds the outer root `Cargo.toml` — whose `exclude` path does not match the
# nested location. An empty `[workspace]` makes the crate self-describing
# wherever the checkout sits, so `scripts/verify.sh --gui` runs from a worktree.
[workspace]

[package]
name = "swept-gui"
version = "0.5.0"
edition = "2021"
description = "Swept desktop GUI (Tauri shell over swept-core)."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: decodes the menu-bar template icon at startup via
# tauri::image::Image::from_bytes, which is gated behind it.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swept-core = { path = "../../core" }
swept-gui-core = { path = "../../gui-core" }

[[bin]]
name = "swept-gui"
path = "src/main.rs"
