[workspace]
resolver = "2"
members = ["crates/safety", "crates/core", "crates/gui-core", "crates/cli"]
# The Tauri shell builds a webview app (heavy, needs the frontend dist + npm); it
# is built by its own CI job, not the core `cargo test --workspace`.
exclude = ["crates/gui/src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "5"
plist = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
tempfile = "3"
filetime = "0.2"
proptest = "1"

[profile.release]
strip = true
lto = "thin"
