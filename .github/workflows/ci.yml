name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    # macOS: this is a macOS-targeted tool and the `trash` crate links system frameworks.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Safety guard — tests must not touch the real home
        run: |
          # Integration tests must build their own tempfile fixture, never
          # resolve the real $HOME (SAFETY CONTRACT item 7).
          if rg -n 'dirs::home_dir|env::var\("HOME"\)|env::home_dir' \
                -g '**/tests/**/*.rs' crates; then
            echo "::error::A test resolves the real home directory. Use a tempfile fixture instead (SAFETY CONTRACT item 7)."
            exit 1
          fi
          echo "OK: no test resolves the real home directory."

  release-build:
    # Build a release binary and publish it as an artifact (and a Release on tags).
    needs: check
    # Least-privilege: only this job gets write, and only to create the Release.
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p macclean

      - name: Upload macclean binary
        uses: actions/upload-artifact@v4
        with:
          name: macclean-macos
          path: target/release/macclean
          if-no-files-found: error

      - name: Attach binary to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/macclean

  gui:
    # The Tauri shell is excluded from the core workspace; build it on its own:
    # frontend (Vite) first so the dist exists, then the Rust webview crate.
    needs: check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: crates/gui
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo (Tauri crate)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gui/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend (tsc + vite)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: UX harness (screenshots + axe a11y + visual-regression)
        run: npm run ux

      - name: Upload UX screenshots + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-screenshots
          path: |
            crates/gui/ux/screenshots
            crates/gui/playwright-report
          if-no-files-found: warn

      - name: Rust fmt + clippy (Tauri shell)
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Tauri shell
        run: cargo build --manifest-path src-tauri/Cargo.toml
