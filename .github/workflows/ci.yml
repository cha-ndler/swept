name: ci

# ---------------------------------------------------------------------------
# Actions minutes are a hard constraint on this repo, and the reason is worth
# writing down rather than rediscovering.
#
# This is a macOS-targeted tool, so the jobs that carry real signal have to run
# on macOS runners.
#
# HISTORY, because the shape below only makes sense with it: this workflow was
# built for a PRIVATE repository, where GitHub bills macOS at 10x. Four macOS
# jobs at ~3-4 minutes is ~140 billed minutes -- about fourteen runs against a
# 2,000 minute allowance, and that allowance was exhausted once, at which point
# jobs stop starting at all (they fail in ~2 seconds having run zero steps,
# which looks exactly like a broken build and is not one).
#
# The repository is PUBLIC now, so standard runners are free and none of that
# arithmetic is live. The frugal shape is kept anyway because it buys speed and
# signal density rather than money -- and because going private again would
# bring the whole constraint straight back.
#
# So the rules here are:
#   1. Never spend a macOS minute on a change that cannot affect the result —
#      hence `paths-ignore` for prose and design assets.
#   2. Never let a superseded run finish — hence `concurrency`.
#   3. Only `check` and `gui` carry signal a pull request needs. `release-build`
#      and `package` produce artifacts nobody consumes between releases, so they
#      run on a `v*` tag only — not on every push to main, which was ~2.2 macOS
#      minutes (~22 billed) per merge for a `.dmg` that was never downloaded.
#   4. Every job has a timeout, so a hung runner cannot eat the month.
#
# What rule 3 costs, stated rather than glossed: `cargo tauri build` is the only
# thing that exercises release codegen and the bundler, and nothing else runs it
# — the local Tauri gate is a *debug* `cargo build`. So a packaging regression
# now surfaces when a release is cut rather than at the next merge.
# `scripts/verify.sh --bundle` is the local equivalent, and `workflow_dispatch`
# below runs these jobs on demand. Run one of them before tagging.
#
# **The repository is public now (D6), so none of the billing above applies any
# more** — Actions minutes are free on public repositories, and the rules that
# remain are kept for reasons that outlived the bill: a superseded run is still
# waste, a hung runner is still a hung runner, and prose still cannot break a
# build. Rule 3 is the one that was purely economic, and it now costs *time*
# rather than money: `package` builds two architectures, so putting it on every
# pull request would add a quarter of an hour to each. It stays on tags and
# `workflow_dispatch` until someone decides that trade is worth making — see D5
# in ROADMAP.md. Dispatch it by hand before tagging; nothing else runs the
# bundler.
#
# `scripts/verify.sh` runs the same gates locally and is the primary oracle;
# CI is the second opinion, not the only one.
# ---------------------------------------------------------------------------

# The two `paths-ignore` lists below are duplicated on purpose: GitHub Actions
# does not support YAML anchors, so an alias here parses as an error rather than
# as sharing. Keep them in step.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "design/**"
      - "LICENSE"
      - ".claude/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "design/**"
      - "LICENSE"
      - ".claude/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".gitignore"
  # So the artifact jobs can be run on demand — before cutting a release, or to
  # check a packaging change without pushing a tag.
  workflow_dispatch:

# A force-push or a quick follow-up commit used to leave the previous run going
# to completion. On PRs that is pure waste; on main and tags a run is finishing
# something (an artifact, a release) and must not be interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    # macOS, and deliberately not moved to a cheaper Linux runner. This job is
    # the safety kernel's oracle, and the kernel exists to reason about *macOS*
    # path semantics: case-insensitive volumes, `/var/folders` and `/Users`
    # being symlinks, what `realpath` does and does not normalise. A green run
    # on Linux would be testing different semantics and would be a false
    # negative on precisely the rules that matter most.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Safety guard — tests must not touch the real home
        run: |
          # Integration tests must build their own tempfile fixture, never
          # resolve the real $HOME (SAFETY CONTRACT item 7).
          if rg -n 'dirs::home_dir|env::var\("HOME"\)|env::home_dir' \
                -g '**/tests/**/*.rs' crates; then
            echo "::error::A test resolves the real home directory. Use a tempfile fixture instead (SAFETY CONTRACT item 7)."
            exit 1
          fi
          echo "OK: no test resolves the real home directory."

  gui:
    # The Tauri shell is excluded from the core workspace; build it on its own:
    # frontend (Vite) first so the dist exists, then the Rust webview crate.
    #
    # Also macOS-only by necessity: the visual-regression baselines are
    # `*-darwin.png`. Chromium renders text differently on Linux, so every
    # snapshot would fail — the gate would be measuring the runner, not the app.
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/gui
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo (Tauri crate)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gui/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend (tsc + vite)
        run: npm run build

      # ~150 MB downloaded on every run otherwise, at macOS billing rates.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/gui/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: UX harness (screenshots + axe a11y + visual-regression)
        run: npm run ux

      - name: Upload UX screenshots + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-screenshots
          path: |
            crates/gui/ux/screenshots
            crates/gui/playwright-report
          if-no-files-found: warn

      - name: Rust fmt + clippy (Tauri shell)
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Tauri shell
        run: cargo build --manifest-path src-tauri/Cargo.toml

  release-build:
    # Produces the `swept` binary artifact. Its only output is that artifact, and
    # `check` has already compiled and tested the same code — so everywhere but a
    # release this is a macOS release build for nothing. Tags and manual runs
    # only.
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Both, so the binary can be `lipo`'d into one that runs on either.
      - name: Install Rust (stable, both macOS architectures)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # A bare `cargo build --release` inherits the runner's architecture, and
      # the runner is Apple Silicon — so every binary this project has ever
      # published simply did not run on an Intel Mac. Naming both targets and
      # merging them is the whole of the fix.
      - name: Build release binary (universal)
        run: |
          cargo build --release -p swept --target aarch64-apple-darwin
          cargo build --release -p swept --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/swept \
            target/aarch64-apple-darwin/release/swept \
            target/x86_64-apple-darwin/release/swept
          lipo -info dist/swept

      # A download nobody can verify is a download you have to take on trust.
      # Written next to the file, with a bare filename inside, so `shasum -c
      # swept.sha256` works in the directory you downloaded it to.
      - name: Checksum
        run: cd dist && shasum -a 256 swept | tee swept.sha256

      - name: Upload swept binary
        uses: actions/upload-artifact@v4
        with:
          name: swept-macos-universal
          path: |
            dist/swept
            dist/swept.sha256
          if-no-files-found: error

      # The release notes are the CHANGELOG section for this tag, so the two can
      # never say different things about the same version.
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME}" | tee dist/notes.md

      - name: Attach binary to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Draft, because the assets arrive from two jobs and `package` is much
          # the slower of them. Publishing on first contact would put a release
          # page up saying "v0.4.0, download it" with the `.dmg` still
          # compiling — on a project whose whole pitch is the download. It is
          # published by hand once both jobs are green and the checksums check.
          draft: true
          body_path: dist/notes.md
          files: |
            dist/swept
            dist/swept.sha256

  package:
    # Bundle the desktop app (.app + .dmg). The heaviest job by far (release
    # build + `cargo install tauri-cli` + bundling), and its output is a `.dmg`
    # that nothing consumes between releases — so tags and manual runs only.
    # `scripts/verify.sh --bundle` is the local equivalent; run it before
    # tagging, because nothing else exercises the bundler.
    # On a v* tag it also attaches the .dmg to the GitHub Release.
    needs: gui
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    # Hoisted to the job so the steps below can branch on presence. The
    # `secrets` context is not available in a step `if:`, but `env` is — so
    # testing `secrets.X != ''` directly in a condition silently evaluates to
    # false and skips the step even when the secret is set.
    env:
      HAVE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAVE_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_CONTENT != '' }}
    defaults:
      run:
        working-directory: crates/gui
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable, both macOS architectures)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo (Tauri crate)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gui/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json

      - name: Install frontend deps
        run: npm ci

      # `cargo install` rebuilds the CLI from source on every run otherwise.
      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # Signing + notarization are OPTIONAL. When the secrets are absent every
      # variable below is empty, Tauri skips signing, and the job produces the
      # same unsigned .dmg it always has — so a fork, or this repo before a
      # certificate exists, still builds. Nothing here is wasted if the
      # certificate never appears, and nothing here fails when it hasn't.
      #
      # Set up: docs/RELEASING.md. Required secrets, all or none:
      #   APPLE_CERTIFICATE           base64 of the Developer ID .p12
      #   APPLE_CERTIFICATE_PASSWORD  its export password
      #   APPLE_SIGNING_IDENTITY      "Developer ID Application: NAME (TEAMID)"
      #   APPLE_API_KEY               App Store Connect key id
      #   APPLE_API_ISSUER            its issuer uuid
      #   APPLE_API_KEY_CONTENT       the .p8 file's contents

      # notarytool wants the .p8 as a file, and a secret is a string. Passed
      # through `env` rather than interpolated into the script: a `${{ }}` in a
      # `run:` block is pasted in as shell source, so a key containing shell
      # metacharacters would be executed rather than written.
      - name: Stage notarization API key
        id: api-key
        if: env.HAVE_NOTARY_KEY == 'true'
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          key_path="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      # `--target universal-apple-darwin` moves the bundle two directories
      # deeper — every path below has to agree with it or the upload fails on
      # `if-no-files-found: error`, which is the intended way to find out.
      #
      # Signing happens inside this step: Tauri signs each bundle as it is
      # produced, so there is no separate codesign pass to keep in step with
      # the universal target's paths.
      - name: Build app bundle (.app + .dmg, universal)
        env:
          # Signing. Empty when unset, which is how Tauri detects "don't sign".
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization, via an App Store Connect API key rather than an
          # Apple ID + app-specific password: the key is scoped to notarization
          # alone, so a leak cannot touch the account, and it does not break
          # when the account's 2FA changes.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.api-key.outputs.path }}
        run: cargo tauri build --target universal-apple-darwin

      # Checksums are taken AFTER signing and stapling, not before: stapling
      # rewrites the .dmg, so a hash computed earlier would not match what a
      # user downloads.
      - name: Checksum the .dmg
        working-directory: crates/gui/src-tauri/target/universal-apple-darwin/release/bundle/dmg
        run: |
          for f in *.dmg; do shasum -a 256 "$f" | tee "$f.sha256"; done

      # Proof, not assumption. `cargo tauri build` reports success whether or
      # not it signed anything, so a misconfigured secret would otherwise ship
      # an unsigned .dmg under a release that claims to be signed. This step
      # fails the job in that case.
      #
      # `spctl --assess` is what Gatekeeper itself runs, and `stapler validate`
      # proves the notarization ticket is attached to the file rather than only
      # present on Apple's servers — which is the difference between the app
      # opening offline and not.
      - name: Verify signature and notarization
        if: env.HAVE_IDENTITY == 'true'
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -1)
          dmg=$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' | head -1)
          echo "::group::codesign"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app"
          echo "::endgroup::"
          echo "::group::gatekeeper"
          spctl --assess --type execute --verbose=4 "$app"
          echo "::endgroup::"
          echo "::group::notarization ticket"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          echo "::endgroup::"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: swept-gui-macos-universal
          path: |
            crates/gui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            crates/gui/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Attach .dmg to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Kept draft here too: whichever job reaches the release first creates
          # it, so if this one wins the race a `false` would publish it with no
          # CLI binary on it.
          draft: true
          files: |
            crates/gui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            crates/gui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sha256
